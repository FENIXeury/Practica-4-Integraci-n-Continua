name: Build, Push and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v5

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login en Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y subir imagen
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/hola-mundo-de-eury-en-devops:latest
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/hola-mundo-de-eury-en-devops:${{ github.sha }}

  deploy-render:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Desplegar en Render
        run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
